<!doctype html><html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Schedule</title><link rel="stylesheet" href="/style.css"></head><body><main><section id="login" class="card"><h1>Schedule</h1><p>Masuk dengan username untuk mengelola janji temu.</p><form id="loginForm"><label>Username<input id="username" placeholder="Username" maxlength="255" autocomplete="username" required></label><button>Masuk</button></form><small>Demo: siti, alex, maya</small><div id="loginError" class="error" role="alert"></div></section><section id="app" hidden><header><div><h1>Janji temu</h1><span id="who"></span></div><button id="logout" class="ghost">Keluar</button></header><div class="grid"><section class="card"><h2>Jadwal mendatang</h2><div id="list" aria-live="polite"><p>Memuat...</p></div><nav aria-label="Halaman janji temu"><button id="previous" class="ghost" disabled>Sebelumnya</button> <span id="page">Halaman 1</span> <button id="next" class="ghost" disabled>Berikutnya</button></nav></section><section class="card"><h2>Buat janji temu</h2><form id="appointmentForm"><label>Judul<input id="title" maxlength="255" required></label><label>Mulai (UTC)<input id="start" type="datetime-local" required></label><label>Selesai (UTC)<input id="end" type="datetime-local" required></label><label>Undang (username, pisahkan koma)<input id="invitees" placeholder="alex, maya"></label><button>Buat janji</button></form><div id="formMessage" role="status"></div></section></div></section></main><script src="/app.js"></script></body></html>
