spring:
  application:
    name: appointment-system
  datasource:
    url: jdbc:h2:file:./data/appointments
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  h2:
    console:
      enabled: false
server:
  port: 8080
