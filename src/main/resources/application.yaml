spring:
  application:
    name: appointment-system

  datasource:
    url: jdbc:mysql://localhost:3306/appointments
    username: root
    password:
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

server:
  port: 8080